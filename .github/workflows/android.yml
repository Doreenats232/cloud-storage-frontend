name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Restore fixed signing key
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
      - run: npm ci && npm run build
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CloudStorage.apk
      - uses: actions/upload-artifact@v4
        with: { name: CloudStorage-apk, path: CloudStorage.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete latest -y --cleanup-tag || true; gh release create latest CloudStorage.apk --title "Cloud Storage APK" --notes "Latest build" --latest
